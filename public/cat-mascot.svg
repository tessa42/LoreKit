<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" fill="none">

  <!-- Drop shadow -->
  <ellipse cx="79" cy="178" rx="31" ry="4" fill="#000" opacity="0.18"/>

  <!-- TAIL (drawn first so it's behind body) -->
  <path d="M 106 150 C 142 138 148 110 133 96 C 122 84 107 95 112 112 C 117 126 108 138 96 146"
        stroke="#3a2082" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M 106 150 C 142 138 148 110 133 96 C 122 84 107 95 112 112 C 117 126 108 138 96 146"
        stroke="#5a36b8" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- BODY -->
  <ellipse cx="78" cy="151" rx="30" ry="24" fill="#3a2082"/>
  <!-- Belly -->
  <ellipse cx="78" cy="155" rx="17" ry="15" fill="#5a36b8" opacity="0.4"/>

  <!-- PAWS -->
  <ellipse cx="57" cy="168" rx="13" ry="8"   fill="#2b1668"/>
  <ellipse cx="99" cy="168" rx="13" ry="8"   fill="#2b1668"/>
  <ellipse cx="57" cy="166" rx="9"  ry="5.5" fill="#3a2082"/>
  <ellipse cx="99" cy="166" rx="9"  ry="5.5" fill="#3a2082"/>

  <!-- LEFT EAR (rounded bezier — drawn before head so head covers base) -->
  <path d="M 28 54 C 22 28 32 6 54 11 C 65 13 67 34 63 53 Z" fill="#3a2082"/>
  <path d="M 33 50 C 28 30 36 13 54 17 C 63 20 64 36 61 51 Z" fill="#7c3aed" opacity="0.65"/>

  <!-- RIGHT EAR -->
  <path d="M 132 54 C 138 28 128 6 106 11 C 95 13 93 34 97 53 Z" fill="#3a2082"/>
  <path d="M 127 50 C 132 30 124 13 106 17 C 97 20 96 36 99 51 Z" fill="#7c3aed" opacity="0.65"/>

  <!-- HEAD (large — chibi proportions) -->
  <circle cx="80" cy="76" r="51" fill="#3a2082"/>
  <!-- Subtle face highlight -->
  <ellipse cx="80" cy="82" rx="37" ry="31" fill="#5a36b8" opacity="0.2"/>

  <!-- EYE GLOW -->
  <circle cx="60" cy="77" r="16" fill="#0d9488" opacity="0.16"/>
  <circle cx="100" cy="77" r="16" fill="#0d9488" opacity="0.16"/>
  <!-- IRIS (big round — kawaii) -->
  <circle cx="60" cy="77" r="13" fill="#2dd4bf"/>
  <circle cx="100" cy="77" r="13" fill="#2dd4bf"/>
  <!-- PUPIL (round) -->
  <circle cx="60" cy="78" r="7.5" fill="#060412"/>
  <circle cx="100" cy="78" r="7.5" fill="#060412"/>
  <!-- Main shine -->
  <circle cx="65"  cy="71" r="4.5" fill="white" opacity="0.92"/>
  <circle cx="105" cy="71" r="4.5" fill="white" opacity="0.92"/>
  <!-- Secondary shine -->
  <circle cx="56"  cy="82" r="2"   fill="white" opacity="0.55"/>
  <circle cx="96"  cy="82" r="2"   fill="white" opacity="0.55"/>

  <!-- BLUSH CHEEKS -->
  <ellipse cx="42"  cy="92" rx="12" ry="7" fill="#f9a8d4" opacity="0.38"/>
  <ellipse cx="118" cy="92" rx="12" ry="7" fill="#f9a8d4" opacity="0.38"/>

  <!-- NOSE (tiny triangle) -->
  <path d="M 80 98 L 75 92 L 85 92 Z" fill="#f9a8d4"/>

  <!-- MOUTH (cute small smile) -->
  <path d="M 75 98 Q 80 105 85 98"
        stroke="#f9a8d4" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- WHISKERS left -->
  <line x1="26" y1="89"  x2="64" y2="93"  stroke="#c4b5fd" stroke-width="1.2" opacity="0.55"/>
  <line x1="23" y1="97"  x2="63" y2="98"  stroke="#c4b5fd" stroke-width="1.2" opacity="0.55"/>
  <line x1="24" y1="104" x2="63" y2="103" stroke="#c4b5fd" stroke-width="1.0" opacity="0.38"/>

  <!-- WHISKERS right -->
  <line x1="134" y1="89"  x2="96" y2="93"  stroke="#c4b5fd" stroke-width="1.2" opacity="0.55"/>
  <line x1="137" y1="97"  x2="97" y2="98"  stroke="#c4b5fd" stroke-width="1.2" opacity="0.55"/>
  <line x1="136" y1="104" x2="97" y2="103" stroke="#c4b5fd" stroke-width="1.0" opacity="0.38"/>

  <!-- 4-point GOLD STAR (top-left) -->
  <path d="M 22 30 L 25 23 L 28 30 L 25 37 Z
           M 15 30 L 25 27 L 35 30 L 25 33 Z" fill="#fbbf24" opacity="0.92"/>

  <!-- 4-point VIOLET STAR (top-right) -->
  <path d="M 136 22 L 139 15 L 142 22 L 139 29 Z
           M 129 22 L 139 19 L 149 22 L 139 25 Z" fill="#a78bfa" opacity="0.92"/>

  <!-- Tiny sparkle dots -->
  <circle cx="11"  cy="66"  r="2.6" fill="#2dd4bf" opacity="0.6"/>
  <circle cx="150" cy="52"  r="2.0" fill="#fbbf24" opacity="0.65"/>
  <circle cx="151" cy="148" r="2.2" fill="#a78bfa"  opacity="0.55"/>
  <circle cx="9"   cy="142" r="1.8" fill="#f9a8d4"  opacity="0.55"/>

</svg>
